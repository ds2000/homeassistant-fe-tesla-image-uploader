<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submission Review</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; color: #eee;
      font-family: 'Gotham', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; padding: 24px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; color: #fff; font-weight: 600; }
    .subtitle { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 20px; }

    .mode-row { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; }
    .mode-btn {
      padding: 6px 14px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #fff;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.12s;
    }
    .mode-btn:hover { background: rgba(255,255,255,0.12); }
    .mode-btn.active { border-color: #e82127; background: rgba(232,33,39,0.15); color: #e82127; }

    .layout { display: flex; gap: 32px; flex-wrap: wrap; }
    .col-preview { flex: 0 0 auto; }
    .col-files { flex: 1; min-width: 280px; }

    /* Toggle buttons */
    .toggle-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .toggle-btn {
      padding: 8px 18px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #fff;
      cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.12s; min-width: 60px; text-align: center;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.12); }
    .toggle-btn.active { border-color: #e82127; background: rgba(232,33,39,0.15); color: #e82127; }

    /* Preview area */
    .preview {
      position: relative; width: 417px; height: 262px;
      background: #161719; border-radius: 8px; overflow: hidden;
      margin-bottom: 8px;
    }
    .preview img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    .preview .overlay-img { pointer-events: none; }
    .preview-info { font-size: 11px; color: rgba(255,255,255,0.35); margin-bottom: 20px; word-break: break-all; }

    /* File status */
    .summary { margin-bottom: 12px; font-size: 13px; }
    .pass { color: #2ecc71; }
    .fail { color: #e74c3c; }
    .muted { color: rgba(255,255,255,0.35); }
    table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
    th, td { text-align: left; padding: 5px 10px; font-size: 12px; }
    th { color: rgba(255,255,255,0.4); border-bottom: 1px solid rgba(255,255,255,0.1); }
    td { border-bottom: 1px solid rgba(255,255,255,0.05); }
    .status-ok { color: #2ecc71; }
    .status-fail { color: #e74c3c; }
    .status-na { color: rgba(255,255,255,0.25); }

    /* Overlay grid */
    .overlay-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .overlay-thumb {
      width: 140px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; overflow: hidden; background: #1a1a1a;
    }
    .overlay-thumb img {
      width: 100%; height: 86px; object-fit: contain; display: block;
      background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 12px 12px;
    }
    .overlay-thumb .label { padding: 3px 6px; font-size: 9px; color: rgba(255,255,255,0.5); }

    /* Panel overhead views */
    .panels-section { margin-top: 24px; }
    .panels-section h2 { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 600; }
    .panels-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .panel-card {
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; overflow: hidden; width: 180px;
    }
    .panel-card img { width: 100%; display: block; }
    .panel-card .label { padding: 4px 8px; font-size: 10px; color: rgba(255,255,255,0.5); }

    .error-msg {
      background: rgba(232,33,39,0.1); border: 1px solid rgba(232,33,39,0.3);
      border-radius: 8px; padding: 20px; color: #e82127; max-width: 500px;
    }
    .error-msg code { color: #fff; }

    @keyframes chargePulse {
      0%, 100% { filter: brightness(1) drop-shadow(0 0 6px rgba(34,197,94,0.3)); }
      50%      { filter: brightness(1.5) drop-shadow(0 0 14px rgba(34,197,94,0.9)); }
    }
    .charging-glow { animation: chargePulse 2s ease-in-out infinite; }
    .mode-btn.active-green { border-color: #22c55e; background: rgba(34,197,94,0.15); color: #22c55e; }

    /* Branch switcher */
    .branch-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .branch-select {
      padding: 7px 12px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.15);
      background: #1a1a1a; color: #fff;
      font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      min-width: 280px; max-width: 420px;
    }
    .branch-select:focus { border-color: #e82127; outline: none; }
    .branch-select option { background: #1a1a1a; color: #fff; }
    .branch-select optgroup { color: rgba(255,255,255,0.5); font-style: normal; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  var REPO = 'ds2000/homeassistant-fe-tesla-image-uploader';
  var params = new URLSearchParams(window.location.search);
  var branch = params.get('branch');
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  var app = document.getElementById('app');

  if (!branch && !isLocal) {
    app.innerHTML = '<div class="error-msg">Missing <code>?branch=</code> parameter.<br><br>Example: <code>review.html?branch=submissions/3-3.1-red_multi_coat-a3f9</code></div>';
  }

  function rawUrl(path) {
    if (isLocal) return '/git/' + path + '?ref=' + encodeURIComponent(branch);
    return 'https://raw.githubusercontent.com/' + REPO + '/' + branch + '/' + path;
  }

  var MODES = {
    offcharge: {
      dir: 'processed/offcharge/overlays',
      files: [
        { name: 'base.png', required: true, isOverlay: false },
        { name: 'trunk-open.png', required: true, isOverlay: false },
        { name: 'trunk-overlay.png', required: true, isOverlay: true },
        { name: 'chargeport-overlay.png', required: true, isOverlay: true },
        { name: 'frunk-overlay.png', required: true, isOverlay: true },
        { name: 'fr-overlay.png', required: true, isOverlay: true },
        { name: 'ff-overlay.png', required: true, isOverlay: true },
        { name: 'nr-overlay.png', required: true, isOverlay: true },
        { name: 'nf-overlay.png', required: true, isOverlay: true },
        { name: 'nf-nr-combined-overlay.png', required: false, isOverlay: true },
        { name: 'ff-fr-combined-overlay.png', required: false, isOverlay: true }
      ],
      toggles: [
        { id: 'trunk', label: 'Trunk' },
        { id: 'chargeport', label: 'Chargeport' },
        { id: 'frunk', label: 'Frunk' },
        { id: 'nf', label: 'NF' },
        { id: 'nr', label: 'NR' },
        { id: 'ff', label: 'FF' },
        { id: 'fr', label: 'FR' }
      ],
      zOrder: ['chargeport', 'fr', 'ff', 'frunk', 'nr', 'nf'],
      combined: { 'nf+nr': 'nf-nr-combined-overlay.png', 'ff+fr': 'ff-fr-combined-overlay.png' },
      prefix: '',
      panels: [
        { name: 'controls-bg.png', dir: 'processed/offcharge', label: 'Controls' },
        { name: 'climate-bg.png', dir: 'processed/offcharge', label: 'Climate' }
      ]
    },
    oncharge: {
      dir: 'processed/oncharge/overlays',
      files: [
        { name: 'oncharge-base.png', required: true, isOverlay: false },
        { name: 'oncharge-trunk-open.png', required: true, isOverlay: false },
        { name: 'oncharge-trunk-overlay.png', required: true, isOverlay: true },
        { name: 'oncharge-frunk-overlay.png', required: true, isOverlay: true },
        { name: 'oncharge-fr-overlay.png', required: true, isOverlay: true },
        { name: 'oncharge-nr-overlay.png', required: true, isOverlay: true },
        { name: 'oncharge-nf-overlay.png', required: true, isOverlay: true },
        { name: 'oncharge-nf-nr-combined-overlay.png', required: false, isOverlay: true },
        { name: 'oncharge-cable-overlay.png', required: false, isOverlay: true, isCable: true }
      ],
      toggles: [
        { id: 'trunk', label: 'Trunk' },
        { id: 'frunk', label: 'Frunk' },
        { id: 'nf', label: 'NF' },
        { id: 'nr', label: 'NR' },
        { id: 'fr', label: 'FR' }
      ],
      belowTrunk: ['fr'],
      zOrder: ['frunk', 'nf', 'nr'],
      combined: { 'nf+nr': 'oncharge-nf-nr-combined-overlay.png' },
      prefix: 'oncharge-',
      panels: [
        { name: 'controls-bg-charging.png', dir: 'processed/oncharge', label: 'Controls (Charging)' },
        { name: 'climate-bg-charging.png', dir: 'processed/oncharge', label: 'Climate (Charging)' }
      ]
    }
  };

  var chargingMode = false;
  var chargingActive = false;
  var active = {};
  var fileStatus = {};

  function mode() { return chargingMode ? MODES.oncharge : MODES.offcharge; }

  function resetActive() {
    active = {};
    mode().toggles.forEach(function (t) { active[t.id] = false; });
  }

  function testImage(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve({ ok: true, w: img.naturalWidth, h: img.naturalHeight }); };
      img.onerror = function () { resolve({ ok: false, w: 0, h: 0 }); };
      img.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    });
  }

  function init() {
    resetActive();

    app.innerHTML =
      '<h1 id="title">Submission Review</h1>' +
      '<div class="subtitle" id="subtitle"></div>' +
      (isLocal ? '<div class="branch-row" id="branch-row"><select class="branch-select" id="branch-select" disabled><option>Loading branches...</option></select></div>' : '') +
      '<div class="mode-row">' +
        '<button id="btn-offcharge" class="mode-btn active">Offcharge</button>' +
        '<button id="btn-oncharge" class="mode-btn">On-charge</button>' +
        '<button id="btn-charging" class="mode-btn">&#9889; Charging</button>' +
      '</div>' +
      '<div class="summary" id="summary">Loading files...</div>' +
      '<div class="layout">' +
        '<div class="col-preview">' +
          '<div class="toggle-row" id="toggles"></div>' +
          '<div class="preview" id="preview"></div>' +
          '<div class="preview-info" id="preview-info"></div>' +
          '<div class="overlay-grid" id="overlay-grid"></div>' +
          '<div class="panels-section" id="panels-section"></div>' +
        '</div>' +
        '<div class="col-files">' +
          '<table><thead><tr><th>File</th><th>Status</th><th>Size</th></tr></thead>' +
          '<tbody id="file-tbody"></tbody></table>' +
        '</div>' +
      '</div>';

    document.getElementById('subtitle').textContent = 'Branch: ' + (branch || '(select below)');

    if (isLocal) loadBranches();

    document.getElementById('btn-offcharge').addEventListener('click', function () { switchMode(false); });
    document.getElementById('btn-oncharge').addEventListener('click', function () { switchMode(true); });
    document.getElementById('btn-charging').addEventListener('click', function () {
      chargingActive = !chargingActive;
      this.classList.toggle('active-green', chargingActive);
      updatePreview();
    });

    buildToggles();
    // Only load data if branch is already set (URL param or non-local)
    // On localhost, loadBranches() will auto-select and trigger these
    if (branch) {
      updatePreview();
      runTests();
    }
  }

  function switchMode(charging) {
    chargingMode = charging;
    resetActive();
    buildToggles();
    runTests();
    updatePreview();
    document.getElementById('btn-offcharge').classList.toggle('active', !charging);
    document.getElementById('btn-oncharge').classList.toggle('active', charging);
  }

  function buildToggles() {
    var container = document.getElementById('toggles');
    container.innerHTML = '';
    var m = mode();
    m.toggles.forEach(function (t) {
      var btn = document.createElement('button');
      btn.className = 'toggle-btn' + (active[t.id] ? ' active' : '');
      btn.textContent = t.label;
      btn.addEventListener('click', function () {
        active[t.id] = !active[t.id];
        btn.classList.toggle('active', active[t.id]);
        updatePreview();
      });
      container.appendChild(btn);
    });
  }

  function updatePreview() {
    var m = mode();
    var preview = document.getElementById('preview');
    preview.innerHTML = '';

    var zIdx = 1;

    // Base layer (z-index 0) — always base.png
    var baseFile = m.prefix + 'base.png';
    var baseImg = document.createElement('img');
    baseImg.src = rawUrl(m.dir + '/' + baseFile);
    baseImg.alt = baseFile;
    baseImg.style.zIndex = 0;
    preview.appendChild(baseImg);

    // Overlays that render BELOW the trunk lid (oncharge: fr behind trunk)
    var belowTrunk = m.belowTrunk || [];
    belowTrunk.forEach(function (name) {
      if (!active[name]) return;
      var img = document.createElement('img');
      img.src = rawUrl(m.dir + '/' + m.prefix + name + '-overlay.png');
      img.alt = name + '-overlay';
      img.className = 'overlay-img';
      img.style.zIndex = zIdx++;
      preview.appendChild(img);
    });

    // Trunk overlay (transparent diff, not full base swap)
    if (active.trunk) {
      var trunkImg = document.createElement('img');
      trunkImg.src = rawUrl(m.dir + '/' + m.prefix + 'trunk-overlay.png');
      trunkImg.alt = 'trunk-overlay';
      trunkImg.className = 'overlay-img';
      trunkImg.style.zIndex = zIdx++;
      preview.appendChild(trunkImg);
    }

    // Build overlay list from z-order (above trunk)
    var overlayFiles = [];
    var nfNrKey = m.prefix + 'nf-nr-combined-overlay.png';
    var ffFrKey = m.prefix + 'ff-fr-combined-overlay.png';
    var hasNfNrCombined = active.nf && active.nr && fileStatus[nfNrKey] && fileStatus[nfNrKey].ok;
    var hasFfFrCombined = active.ff && active.fr && fileStatus[ffFrKey] && fileStatus[ffFrKey].ok;

    var nfNrFirstSeen = false;
    var ffFrFirstSeen = false;

    m.zOrder.forEach(function (name) {
      if (!active[name]) return;

      if ((name === 'nf' || name === 'nr') && hasNfNrCombined) {
        if (nfNrFirstSeen) overlayFiles.push(m.combined['nf+nr']);
        nfNrFirstSeen = true;
        return;
      }
      if ((name === 'ff' || name === 'fr') && hasFfFrCombined) {
        if (ffFrFirstSeen) overlayFiles.push(m.combined['ff+fr']);
        ffFrFirstSeen = true;
        return;
      }

      overlayFiles.push(m.prefix + name + '-overlay.png');
    });

    // Stack overlays with incrementing z-index
    overlayFiles.forEach(function (f) {
      var img = document.createElement('img');
      img.src = rawUrl(m.dir + '/' + f);
      img.alt = f;
      img.className = 'overlay-img';
      img.style.zIndex = zIdx++;
      preview.appendChild(img);
    });

    // Cable overlay on top of everything
    if (chargingActive && chargingMode && fileStatus['oncharge-cable-overlay.png'] && fileStatus['oncharge-cable-overlay.png'].ok) {
      var cableImg = document.createElement('img');
      cableImg.src = rawUrl(MODES.oncharge.dir + '/oncharge-cable-overlay.png');
      cableImg.alt = 'cable';
      cableImg.className = 'overlay-img charging-glow';
      cableImg.style.zIndex = zIdx++;
      preview.appendChild(cableImg);
    }

    var activeNames = m.toggles.filter(function (t) { return active[t.id]; }).map(function (t) { return t.id; });
    var info = activeNames.length ? baseFile + ' + ' + overlayFiles.join(' + ') : baseFile;
    document.getElementById('preview-info').textContent = info;
  }

  function runTests() {
    var m = mode();
    var tbody = document.getElementById('file-tbody');
    tbody.innerHTML = '';
    fileStatus = {};

    var passed = 0, failed = 0, total = m.files.length;
    var pending = total;

    m.files.forEach(function (f) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + f.name + '</td><td class="muted">...</td><td></td>';
      tbody.appendChild(tr);

      testImage(rawUrl(m.dir + '/' + f.name)).then(function (result) {
        fileStatus[f.name] = result;
        var sizeStr = result.ok ? result.w + '\u00d7' + result.h : '\u2014';
        var statusClass = result.ok ? 'status-ok' : (f.required ? 'status-fail' : 'status-na');
        var statusText = result.ok ? '\u2713' : (f.required ? '\u2715 MISSING' : '\u2014 optional');
        tr.innerHTML = '<td>' + f.name + '</td><td class="' + statusClass + '">' + statusText + '</td><td>' + sizeStr + '</td>';

        if (result.ok) passed++;
        else if (f.required) failed++;

        pending--;
        if (pending === 0) {
          var modeLabel = chargingMode ? ' (on-charge)' : ' (offcharge)';
          document.getElementById('summary').innerHTML =
            '<span class="pass">' + passed + ' files loaded</span>' +
            (failed ? ' \u00b7 <span class="fail">' + failed + ' MISSING</span>' : '') +
            ' \u00b7 <span class="muted">' + total + ' total' + modeLabel + '</span>';
          buildOverlayGrid();
          buildPanels();
          updatePreview();
        }
      });
    });
  }

  function buildOverlayGrid() {
    var m = mode();
    var grid = document.getElementById('overlay-grid');
    grid.innerHTML = '';
    m.files.forEach(function (f) {
      if (f.name === m.prefix + 'base.png') return; // skip base from thumbnails
      if (!fileStatus[f.name] || !fileStatus[f.name].ok) return;
      var thumb = document.createElement('div');
      thumb.className = 'overlay-thumb';
      thumb.innerHTML = '<img src="' + rawUrl(m.dir + '/' + f.name) + '" loading="lazy" /><div class="label">' + f.name + '</div>';
      grid.appendChild(thumb);
    });
  }

  function buildPanels() {
    var m = mode();
    var section = document.getElementById('panels-section');
    if (!m.panels || !m.panels.length) { section.innerHTML = ''; return; }
    var html = '<h2>Overhead Views</h2><div class="panels-row">';
    m.panels.forEach(function (p) {
      html += '<div class="panel-card">' +
        '<img src="' + rawUrl(p.dir + '/' + p.name) + '" loading="lazy" />' +
        '<div class="label">' + p.label + '</div></div>';
    });
    html += '</div>';
    section.innerHTML = html;
  }

  function loadBranches() {
    fetch('/api/branches').then(function (r) { return r.json(); }).then(function (data) {
      var sel = document.getElementById('branch-select');
      if (!sel || !data.branches || !data.branches.length) {
        if (sel) { sel.innerHTML = '<option>No submission branches found</option>'; }
        return;
      }

      // Group branches by model name
      var groups = {};
      data.branches.forEach(function (b) {
        var modelLabel = b.label.split(' \u2014 ')[0] || b.model;
        if (!groups[modelLabel]) groups[modelLabel] = [];
        groups[modelLabel].push(b);
      });

      sel.innerHTML = '<option value="" disabled>Select a submission...</option>';
      Object.keys(groups).sort().forEach(function (groupName) {
        var optgroup = document.createElement('optgroup');
        optgroup.label = groupName;
        groups[groupName].forEach(function (b) {
          var opt = document.createElement('option');
          opt.value = b.name;
          opt.textContent = b.label;
          if (branch === b.name) opt.selected = true;
          optgroup.appendChild(opt);
        });
        sel.appendChild(optgroup);
      });
      sel.disabled = false;

      sel.addEventListener('change', function () {
        branch = sel.value;
        document.getElementById('subtitle').textContent = 'Branch: ' + branch;
        chargingMode = false;
        resetActive();
        buildToggles();
        runTests();
        updatePreview();
        document.getElementById('btn-offcharge').classList.add('active');
        document.getElementById('btn-oncharge').classList.remove('active');
      });

      // Auto-select first branch if none set
      if (!branch && data.branches.length) {
        sel.selectedIndex = 1; // skip the disabled placeholder
        sel.dispatchEvent(new Event('change'));
      }
    });
  }

  // Init after all definitions are ready
  if (branch || isLocal) init();
</script>

</body>
</html>
