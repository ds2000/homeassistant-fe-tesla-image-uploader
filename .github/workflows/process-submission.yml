# Process submission: validate, align, desaturate, preview, open PR
# Triggered on push to submissions/* branches
name: Process Submission

on:
  push:
    branches:
      - 'submissions/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0

      - name: Detect submission directory
        id: detect
        run: |
          # Find NEW submission directories by comparing against base branch
          # This avoids picking up inherited submission dirs from previous merges
          SUBMISSION_DIR=$(git diff --name-only --diff-filter=A origin/TESUPL0001...HEAD \
            | grep '^submissions/' \
            | head -n1 \
            | sed 's|^\(submissions/[^/]*/[^/]*/[^/]*\)/.*|\1|' \
            | sort -u \
            | head -n1)

          if [ -z "$SUBMISSION_DIR" ]; then
            echo "::error::No new submission directory found (compared to base branch)"
            exit 1
          fi
          echo "submission_dir=$SUBMISSION_DIR" >> "$GITHUB_OUTPUT"
          echo "Found submission directory: $SUBMISSION_DIR"

          # Parse model/variant/colour directly from path segments
          MODEL=$(echo "$SUBMISSION_DIR" | cut -d/ -f2)
          VARIANT=$(echo "$SUBMISSION_DIR" | cut -d/ -f3)
          COLOUR=$(echo "$SUBMISSION_DIR" | cut -d/ -f4)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "colour=$COLOUR" >> "$GITHUB_OUTPUT"
          echo "Parsed: model=$MODEL variant=$VARIANT colour=$COLOUR"

      - name: Fetch models.json from card repo
        run: |
          curl -sL "https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla/main/models.json" \
            -o models.json
          echo "Fetched models.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run validation
        id: validate
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          python scripts/validate_submission.py \
            --submission-dir "$SUBMISSION_DIR" \
            > validation_report.json 2> validation_stderr.txt || true
          # Show climate / validation errors in CI log
          if [ -s validation_stderr.txt ]; then
            cat validation_stderr.txt
          fi

          # Check if validation passed
          if jq -e '.all_pass' validation_report.json > /dev/null 2>&1; then
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            echo "Validation passed"
          else
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Validation failed — see report"
          fi

          # Store report for PR body
          cat validation_report.json

      - name: Fetch reference images for alignment
        if: steps.validate.outputs.validation_passed == 'true'
        id: reference
        env:
          MODEL: ${{ steps.detect.outputs.model }}
          VARIANT: ${{ steps.detect.outputs.variant }}
          COLOUR: ${{ steps.detect.outputs.colour }}
        run: |
          # Find an existing colour for this model/variant in the card repo
          # to use as alignment reference (ensures consistent car positioning)
          REF_COLOUR=$(curl -sL "https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla/main/models.json" \
            | jq -r --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
              '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.hasImages == true and .id != $c) | .id' \
            | head -n1)

          if [ -n "$REF_COLOUR" ]; then
            echo "Reference colour: $REF_COLOUR"
            REF_BASE="https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla/main/images/models/${MODEL}/${VARIANT}/${REF_COLOUR}"
            mkdir -p reference/offcharge/overlays reference/oncharge/overlays

            # Download offcharge reference files
            for f in overlays/base.png controls-bg.png climate-bg.png; do
              curl -sL "${REF_BASE}/${f}" -o "reference/offcharge/${f}" 2>/dev/null || true
            done
            # Download oncharge reference files
            for f in overlays/oncharge-base.png controls-bg-charging.png climate-bg-charging.png; do
              curl -sL "${REF_BASE}/${f}" -o "reference/oncharge/${f}" 2>/dev/null || true
            done

            if [ -f reference/offcharge/overlays/base.png ]; then
              echo "has_reference=true" >> "$GITHUB_OUTPUT"
              echo "Downloaded reference from ${REF_COLOUR}"
            else
              echo "has_reference=false" >> "$GITHUB_OUTPUT"
              echo "Reference download failed — proceeding without alignment"
            fi
          else
            echo "has_reference=false" >> "$GITHUB_OUTPUT"
            echo "No existing reference colour found — first submission for this model/variant"
          fi

      - name: Process screenshots (offcharge)
        if: steps.validate.outputs.validation_passed == 'true'
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
          HAS_REF: ${{ steps.reference.outputs.has_reference }}
        run: |
          REF_ARGS=""
          if [ "$HAS_REF" = "true" ]; then
            REF_ARGS="--reference-dir reference/offcharge"
          fi
          python scripts/process_screenshots.py \
            --input-dir "$SUBMISSION_DIR" \
            --output-dir processed/offcharge/ \
            --mode offcharge \
            --generate-overlays \
            --verbose \
            $REF_ARGS

      - name: Process screenshots (oncharge)
        if: steps.validate.outputs.validation_passed == 'true'
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
          HAS_REF: ${{ steps.reference.outputs.has_reference }}
        run: |
          REF_ARGS=""
          if [ "$HAS_REF" = "true" ]; then
            REF_ARGS="--reference-dir reference/oncharge"
          fi
          python scripts/process_screenshots.py \
            --input-dir "$SUBMISSION_DIR" \
            --output-dir processed/oncharge/ \
            --mode oncharge \
            --generate-overlays \
            --verbose \
            $REF_ARGS

      - name: Commit processed output
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed/offcharge/overlays/ processed/oncharge/overlays/
          git add processed/offcharge/controls-bg.png processed/offcharge/climate-bg.png
          git add processed/oncharge/controls-bg-charging.png processed/oncharge/climate-bg-charging.png
          git diff --cached --quiet && echo "No processed files to commit" && exit 0
          git commit -m "processed: generate overlays (offcharge + oncharge)"
          git push

      - name: Read display labels from models.json
        id: labels
        env:
          MODEL: ${{ steps.detect.outputs.model }}
          VARIANT: ${{ steps.detect.outputs.variant }}
          COLOUR: ${{ steps.detect.outputs.colour }}
        run: |
          MODEL_LABEL=$(jq -r --arg m "$MODEL" \
            '.models[] | select(.id == $m) | .name' models.json)
          VARIANT_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .label' models.json)
          COLOUR_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.id == $c) | .name' models.json)

          echo "model_label=$MODEL_LABEL" >> "$GITHUB_OUTPUT"
          echo "variant_label=$VARIANT_LABEL" >> "$GITHUB_OUTPUT"
          echo "colour_label=$COLOUR_LABEL" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        id: pr_body
        env:
          MODEL_LABEL: ${{ steps.labels.outputs.model_label }}
          VARIANT_LABEL: ${{ steps.labels.outputs.variant_label }}
          COLOUR_LABEL: ${{ steps.labels.outputs.colour_label }}
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          PASSED=$(jq -r '.passed' validation_report.json 2>/dev/null || echo "?")
          TOTAL=$(jq -r '.required_count' validation_report.json 2>/dev/null || echo "?")
          FAILED_FILES=""
          if [ "$VALIDATION_PASSED" != "true" ]; then
            FAILED_FILES=$(jq -r '.files[] | select(.error != null) | "- **\(.file)**: \(.error)"' validation_report.json 2>/dev/null || echo "")
          fi

          REVIEW_URL="https://homeassistant-fe-tesla-image-uploader.pages.dev/review.html?branch=${HEAD_REF}"

          RAW_BASE="https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla-image-uploader/${HEAD_REF}"

          cat > pr_body.md <<PREOF
          ## Submission: ${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}

          ### Review
          [Open interactive review](${REVIEW_URL}) — toggle doors on/off to verify overlays.

          ### Overhead Views
          | Controls | Climate |
          |:---:|:---:|
          | ![Controls](${RAW_BASE}/processed/offcharge/controls-bg.png) | ![Climate](${RAW_BASE}/processed/offcharge/climate-bg.png) |

          | Controls (Charging) | Climate (Charging) |
          |:---:|:---:|
          | ![Controls Charging](${RAW_BASE}/processed/oncharge/controls-bg-charging.png) | ![Climate Charging](${RAW_BASE}/processed/oncharge/climate-bg-charging.png) |

          ### Validation
          $(if [ "$VALIDATION_PASSED" = "true" ]; then
            echo "All ${TOTAL} required files passed validation."
          else
            echo "**${PASSED}/${TOTAL} files passed.** The following issues were found:"
            echo ""
            echo "$FAILED_FILES"
          fi)
          PREOF

          sed -i 's/^          //' pr_body.md

      - name: Create Pull Request
        id: create_pr
        env:
          MODEL_LABEL: ${{ steps.labels.outputs.model_label }}
          VARIANT_LABEL: ${{ steps.labels.outputs.variant_label }}
          COLOUR_LABEL: ${{ steps.labels.outputs.colour_label }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          # Skip if PR already exists for this branch (re-triggered by processed commit push)
          EXISTING=$(gh pr list --head "$HEAD_REF" --base TESUPL0001 --json number,url --jq '.[0]' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            PR_NUMBER=$(echo "$EXISTING" | jq -r '.number')
            PR_URL=$(echo "$EXISTING" | jq -r '.url')
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "PR already exists: #${PR_NUMBER} — skipping creation"
            exit 0
          fi

          TITLE="submission: ${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}"

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body-file pr_body.md \
            --base TESUPL0001 \
            --head "$HEAD_REF")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR #${PR_NUMBER}: ${PR_URL}"

      - name: Update status.json to pending
        env:
          MODEL: ${{ steps.detect.outputs.model }}
          VARIANT: ${{ steps.detect.outputs.variant }}
          COLOUR: ${{ steps.detect.outputs.colour }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          STATUS_KEY="${MODEL}/${VARIANT}/${COLOUR}"

          # Stash any uncommitted processed files before switching branches
          git stash --include-untracked || true

          # Checkout main to update status.json
          git checkout TESUPL0001

          # Update status.json using flat key format
          jq --arg key "$STATUS_KEY" --argjson pr "$PR_NUMBER" \
            '.[$key] = {"status": "pending", "pr": $pr}' \
            status.json > status_updated.json
          mv status_updated.json status.json

          # Commit and push
          git add status.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "status: mark ${STATUS_KEY} as pending (PR #${PR_NUMBER})"
          git push origin TESUPL0001
