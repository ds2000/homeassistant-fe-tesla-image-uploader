# Process submission: validate, align, desaturate, preview, open PR
# Triggered on push to submissions/* branches
name: Process Submission

on:
  push:
    branches:
      - 'submissions/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0

      - name: Detect submission directory
        id: detect
        run: |
          # Find the submission directory (there should be exactly one under submissions/)
          SUBMISSION_DIR=$(find submissions/ -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$SUBMISSION_DIR" ]; then
            echo "::error::No submission directory found under submissions/"
            exit 1
          fi
          echo "submission_dir=$SUBMISSION_DIR" >> "$GITHUB_OUTPUT"
          echo "Found submission directory: $SUBMISSION_DIR"

          # Extract directory name (e.g. 3-3.1-red_multi_coat)
          DIR_NAME=$(basename "$SUBMISSION_DIR")
          echo "dir_name=$DIR_NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch models.json from card repo
        run: |
          curl -sL "https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla/main/models.json" \
            -o models.json
          echo "Fetched models.json"

      - name: Parse model, variant, and colour from submission
        id: parse
        env:
          DIR_NAME: ${{ steps.detect.outputs.dir_name }}
        run: |
          # Parse using models.json: try each model ID as prefix, then each variant ID
          FOUND=false

          for MODEL in $(jq -r '.models[].id' models.json); do
            if [[ "$DIR_NAME" == "${MODEL}-"* ]]; then
              REMAINDER="${DIR_NAME#${MODEL}-}"

              for VARIANT in $(jq -r --arg m "$MODEL" '.models[] | select(.id == $m) | .variants[].id' models.json); do
                if [[ "$REMAINDER" == "${VARIANT}-"* ]]; then
                  COLOUR_AND_TOKEN="${REMAINDER#${VARIANT}-}"
                  # Colour is everything except the last -XXXX (4-char hex token)
                  COLOUR=$(echo "$COLOUR_AND_TOKEN" | sed 's/-[0-9a-f]\{4\}$//')

                  # Verify this colour exists in models.json
                  if jq -e --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
                    '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.id == $c)' \
                    models.json > /dev/null 2>&1; then
                    echo "model=$MODEL" >> "$GITHUB_OUTPUT"
                    echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
                    echo "colour=$COLOUR" >> "$GITHUB_OUTPUT"
                    echo "Parsed: model=$MODEL variant=$VARIANT colour=$COLOUR"
                    FOUND=true
                    break 2
                  fi
                fi
              done
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Could not parse model/variant/colour from directory name: $DIR_NAME"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install opencv-python-headless numpy Pillow

      - name: Run validation
        id: validate
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          python scripts/validate_submission.py \
            --submission-dir "$SUBMISSION_DIR" \
            > validation_report.json 2>&1 || true

          # Check if validation passed
          if jq -e '.all_pass' validation_report.json > /dev/null 2>&1; then
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            echo "Validation passed"
          else
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Validation failed — see report"
          fi

          # Store report for PR body
          cat validation_report.json

      - name: Process screenshots (offcharge)
        if: steps.validate.outputs.validation_passed == 'true'
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          python scripts/process_screenshots.py \
            --input-dir "$SUBMISSION_DIR" \
            --output-dir processed/offcharge/ \
            --mode offcharge \
            --generate-overlays \
            --verbose

      - name: Process screenshots (oncharge)
        if: steps.validate.outputs.validation_passed == 'true'
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          python scripts/process_screenshots.py \
            --input-dir "$SUBMISSION_DIR" \
            --output-dir processed/oncharge/ \
            --mode oncharge \
            --generate-overlays \
            --verbose

      - name: Run alignment
        id: align
        continue-on-error: true
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          LINE_COUNT=$(wc -l < scripts/align_images.py)
          if [ "$LINE_COUNT" -le 5 ]; then
            echo "::notice::align_images.py is a stub ($LINE_COUNT lines) — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/align_images.py \
              --submission-dir "$SUBMISSION_DIR" \
              --reference-dir reference/model3/ \
              --output-dir aligned/ \
              --confidence-report alignment_report.json
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run desaturation
        id: desaturate
        continue-on-error: true
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          LINE_COUNT=$(wc -l < scripts/desaturate_body.py)
          if [ "$LINE_COUNT" -le 5 ]; then
            echo "::notice::desaturate_body.py is a stub ($LINE_COUNT lines) — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/desaturate_body.py \
              --input-dir "$SUBMISSION_DIR" \
              --output-dir desaturated/
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate preview
        id: preview
        continue-on-error: true
        env:
          SUBMISSION_DIR: ${{ steps.detect.outputs.submission_dir }}
        run: |
          LINE_COUNT=$(wc -l < scripts/generate_preview.py)
          if [ "$LINE_COUNT" -le 5 ]; then
            echo "::notice::generate_preview.py is a stub ($LINE_COUNT lines) — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/generate_preview.py \
              --input-dir "$SUBMISSION_DIR" \
              --output preview.png
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read display labels from models.json
        id: labels
        env:
          MODEL: ${{ steps.parse.outputs.model }}
          VARIANT: ${{ steps.parse.outputs.variant }}
          COLOUR: ${{ steps.parse.outputs.colour }}
        run: |
          MODEL_LABEL=$(jq -r --arg m "$MODEL" \
            '.models[] | select(.id == $m) | .name' models.json)
          VARIANT_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .label' models.json)
          COLOUR_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.id == $c) | .name' models.json)

          echo "model_label=$MODEL_LABEL" >> "$GITHUB_OUTPUT"
          echo "variant_label=$VARIANT_LABEL" >> "$GITHUB_OUTPUT"
          echo "colour_label=$COLOUR_LABEL" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        id: pr_body
        env:
          MODEL_LABEL: ${{ steps.labels.outputs.model_label }}
          VARIANT_LABEL: ${{ steps.labels.outputs.variant_label }}
          COLOUR_LABEL: ${{ steps.labels.outputs.colour_label }}
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
          ALIGN_SKIPPED: ${{ steps.align.outputs.skipped }}
          ALIGN_OUTCOME: ${{ steps.align.outcome }}
          DESAT_SKIPPED: ${{ steps.desaturate.outputs.skipped }}
          DESAT_OUTCOME: ${{ steps.desaturate.outcome }}
          PREVIEW_SKIPPED: ${{ steps.preview.outputs.skipped }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          # Build validation summary from report
          PASSED=$(jq -r '.passed' validation_report.json 2>/dev/null || echo "?")
          TOTAL=$(jq -r '.required_count' validation_report.json 2>/dev/null || echo "?")
          FAILED_FILES=""
          if [ "$VALIDATION_PASSED" != "true" ]; then
            FAILED_FILES=$(jq -r '.files[] | select(.error != null) | "- **\(.file)**: \(.error)"' validation_report.json 2>/dev/null || echo "")
          fi

          # Alignment status
          ALIGN_STATUS="Skipped (script not yet implemented)"
          if [ "$ALIGN_SKIPPED" = "false" ]; then
            if [ "$ALIGN_OUTCOME" = "success" ]; then
              ALIGN_STATUS="Completed"
            else
              ALIGN_STATUS="Failed (see logs)"
            fi
          fi

          # Write PR body to file using heredoc
          cat > pr_body.md <<PREOF
          ## Submission: ${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}

          ### Validation
          $(if [ "$VALIDATION_PASSED" = "true" ]; then
            echo "All ${TOTAL} required files passed validation."
          else
            echo "**${PASSED}/${TOTAL} files passed.** The following issues were found:"
            echo ""
            echo "$FAILED_FILES"
          fi)

          ### Processing Pipeline
          | Step | Status |
          |---|---|
          | Validation | $([ "$VALIDATION_PASSED" = "true" ] && echo "Passed" || echo "**Failed**") |
          | Alignment | ${ALIGN_STATUS} |
          | Desaturation | $([ "$DESAT_SKIPPED" = "true" ] && echo "Skipped (stub)" || echo "$DESAT_OUTCOME") |
          | Preview | $([ "$PREVIEW_SKIPPED" = "true" ] && echo "Skipped (stub)" || echo "$PREVIEW_OUTCOME") |
          PREOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' pr_body.md

      - name: Create Pull Request
        id: create_pr
        env:
          MODEL_LABEL: ${{ steps.labels.outputs.model_label }}
          VARIANT_LABEL: ${{ steps.labels.outputs.variant_label }}
          COLOUR_LABEL: ${{ steps.labels.outputs.colour_label }}
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          if [ "$VALIDATION_PASSED" = "true" ]; then
            TITLE="submission: ${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}"
          else
            TITLE="[needs fixes] submission: ${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}"
          fi

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body-file pr_body.md \
            --base main \
            --head "$HEAD_REF")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR #${PR_NUMBER}: ${PR_URL}"

      - name: Update status.json to pending
        env:
          MODEL: ${{ steps.parse.outputs.model }}
          VARIANT: ${{ steps.parse.outputs.variant }}
          COLOUR: ${{ steps.parse.outputs.colour }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          STATUS_KEY="${MODEL}/${VARIANT}/${COLOUR}"

          # Checkout main to update status.json
          git checkout main

          # Update status.json using flat key format
          jq --arg key "$STATUS_KEY" --argjson pr "$PR_NUMBER" \
            '.[$key] = {"status": "pending", "pr": $pr}' \
            status.json > status_updated.json
          mv status_updated.json status.json

          # Commit and push
          git add status.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "status: mark ${STATUS_KEY} as pending (PR #${PR_NUMBER})"
          git push origin main
