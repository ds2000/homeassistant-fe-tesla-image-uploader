# Update status.json when PRs are merged or closed
name: Update Status

on:
  pull_request:
    types: [closed]

jobs:
  update:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'submissions/')
    env:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TESUPL0001
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Fetch models.json from card repo
        run: |
          curl -sL "https://raw.githubusercontent.com/ds2000/homeassistant-fe-tesla/main/models.json" \
            -o models.json
          echo "Fetched models.json"

      - name: Parse branch name
        id: parse
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Strip submissions/ prefix
          DIR_NAME="${BRANCH#submissions/}"
          echo "Parsing branch: $BRANCH (dir_name: $DIR_NAME)"

          # Parse using models.json: try each model ID as prefix, then each variant ID
          FOUND=false

          for MODEL in $(jq -r '.models[].id' models.json); do
            if [[ "$DIR_NAME" == "${MODEL}-"* ]]; then
              REMAINDER="${DIR_NAME#${MODEL}-}"

              for VARIANT in $(jq -r --arg m "$MODEL" '.models[] | select(.id == $m) | .variants[].id' models.json); do
                if [[ "$REMAINDER" == "${VARIANT}-"* ]]; then
                  COLOUR_AND_TOKEN="${REMAINDER#${VARIANT}-}"
                  # Colour is everything except the last -XXXX (4-char hex token)
                  COLOUR=$(echo "$COLOUR_AND_TOKEN" | sed 's/-[0-9a-f]\{4\}$//')

                  # Verify this colour exists in models.json
                  if jq -e --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
                    '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.id == $c)' \
                    models.json > /dev/null 2>&1; then
                    echo "model=$MODEL" >> "$GITHUB_OUTPUT"
                    echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
                    echo "colour=$COLOUR" >> "$GITHUB_OUTPUT"
                    echo "Parsed: model=$MODEL variant=$VARIANT colour=$COLOUR"
                    FOUND=true
                    break 2
                  fi
                fi
              done
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "::warning::Could not parse model/variant/colour from branch: $BRANCH"
            exit 1
          fi

      - name: Update status.json
        env:
          MODEL: ${{ steps.parse.outputs.model }}
          VARIANT: ${{ steps.parse.outputs.variant }}
          COLOUR: ${{ steps.parse.outputs.colour }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          STATUS_KEY="${MODEL}/${VARIANT}/${COLOUR}"

          if [ "$MERGED" = "true" ]; then
            echo "PR merged — setting status to complete"
            jq --arg key "$STATUS_KEY" \
              '.[$key] = {"status": "complete"}' \
              status.json > status_updated.json
          else
            echo "PR closed without merge — removing pending status"
            jq --arg key "$STATUS_KEY" \
              'del(.[$key])' \
              status.json > status_updated.json
          fi

          mv status_updated.json status.json

      - name: Update README contributors
        if: github.event.pull_request.merged == true
        env:
          MODEL: ${{ steps.parse.outputs.model }}
          VARIANT: ${{ steps.parse.outputs.variant }}
          COLOUR: ${{ steps.parse.outputs.colour }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # Fetch contributor.json from the merged commit via API
          CONTRIBUTOR_JSON=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/contents/submissions/${MODEL}/${VARIANT}/${COLOUR}/contributor.json?ref=${MERGE_SHA}" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -z "$CONTRIBUTOR_JSON" ]; then
            echo "No contributor.json found — skipping README update"
            exit 0
          fi

          CREDIT=$(echo "$CONTRIBUTOR_JSON" | jq -r '.credit // empty')
          CREDIT_TYPE=$(echo "$CONTRIBUTOR_JSON" | jq -r '.type // "name"')

          if [ -z "$CREDIT" ]; then
            echo "No credit info — skipping"
            exit 0
          fi

          # Format display name
          case "$CREDIT_TYPE" in
            github) DISPLAY="[@${CREDIT}](https://github.com/${CREDIT})" ;;
            *) DISPLAY="$CREDIT" ;;
          esac

          # Build submission label from models.json
          MODEL_LABEL=$(jq -r --arg m "$MODEL" '.models[] | select(.id == $m) | .name' models.json)
          VARIANT_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .label' models.json)
          COLOUR_LABEL=$(jq -r --arg m "$MODEL" --arg v "$VARIANT" --arg c "$COLOUR" \
            '.models[] | select(.id == $m) | .variants[] | select(.id == $v) | .colours[] | select(.id == $c) | .name' models.json)
          SUBMISSION="${MODEL_LABEL} ${VARIANT_LABEL} — ${COLOUR_LABEL}"

          # Insert into README contributors table (before the end marker)
          if grep -q "<!-- END_CONTRIBUTORS -->" README.md; then
            sed -i "/<!-- END_CONTRIBUTORS -->/i | ${DISPLAY} | ${SUBMISSION} |" README.md
            echo "Added contributor: ${DISPLAY} — ${SUBMISSION}"
          else
            echo "::warning::END_CONTRIBUTORS marker not found in README.md"
          fi

      - name: Commit and push
        env:
          MODEL: ${{ steps.parse.outputs.model }}
          VARIANT: ${{ steps.parse.outputs.variant }}
          COLOUR: ${{ steps.parse.outputs.colour }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          STATUS_KEY="${MODEL}/${VARIANT}/${COLOUR}"

          git add status.json README.md
          git diff --cached --quiet && echo "No changes — skipping commit" && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$MERGED" = "true" ]; then
            MSG="status: mark ${STATUS_KEY} as complete (PR #${PR_NUMBER} merged)"
          else
            MSG="status: mark ${STATUS_KEY} as available (PR #${PR_NUMBER} closed)"
          fi

          git commit -m "$MSG"
          git push origin TESUPL0001
